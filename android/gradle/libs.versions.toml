[versions]
activity = "1.13.0"
android-gradle = "9.5.2"
compose-bom = "2026.11.01"
coroutines = "1.11.0"
cronet = "500.1.0"
junit = "4.13.2"
kotlin = "2.4.21"
lifecycle = "2.11.1"
# the runtime of the messages that protoc generates, at the version of the flake's protobuf
protobuf = "4.36.2"
# every TrevRPC package of one version works with the others, so this matches the flake's trevrpc input
trevrpc = "1.13.0"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
cronet-bundled = { module = "org.chromium.net:cronet-bundled", version.ref = "cronet" }
junit = { module = "junit:junit", version.ref = "junit" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
trevrpc-core = { module = "zip.trev.trevrpc:core", version.ref = "trevrpc" }
trevrpc-transport-cronet = { module = "zip.trev.trevrpc:transport-cronet", version.ref = "trevrpc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
