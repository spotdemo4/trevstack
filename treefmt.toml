#:schema https://www.schemastore.org/treefmt.json

[global]
excludes = [
  "**/dist/**",
  "**/node_modules/**",
  "**/package-lock.json",
  # generated by buf
  "server/connect/**",
  "web/connect/**",
  "client/src/connect/**",
  "docs/openapi.yaml",
]

[formatter.gofmt]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write"]
includes = ["*.ts", "*.tsx", "*.html", "*.json", "*.yaml", "*.toml", "*.md"]

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.buf]
command = "buf"
options = ["format", "--write"]
includes = ["*.proto"]
no-positional-arg-support = true

[formatter.sqlfluff]
command = "sqlfluff"
options = ["format"]
includes = ["*.sql"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py"]
