<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta id="theme-color" name="theme-color" content="%THEME_LIGHT_PRIMARY%" />
    <script>
      let theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch {
        // Fall back to the system theme when storage is unavailable.
      }
      const dark =
        theme === "dark" ||
        (theme === null && window.matchMedia("(prefers-color-scheme: dark)").matches);

      if (dark) {
        document.querySelector("#theme-color")?.setAttribute("content", "%THEME_DARK_PRIMARY%");
        document.documentElement.classList.add("dark");
      } else {
        document.querySelector("#theme-color")?.setAttribute("content", "%THEME_LIGHT_PRIMARY%");
        document.documentElement.classList.add("light");
      }
    </script>
    <style>
      html {
        background-color: %THEME_LIGHT_BACKGROUND%;
      }
      html.dark {
        background-color: %THEME_DARK_BACKGROUND%;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>TrevStack</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app" class="bg-background"></div>
    <script src="/index.tsx" type="module"></script>
  </body>
</html>
