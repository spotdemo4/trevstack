<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta id="theme-color" name="theme-color" content="#04a5e5" />
    <script>
      const dark =
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches);

      if (dark) {
        document.querySelector("#theme-color")?.setAttribute("content", "#89dceb");
        document.documentElement.classList.add("dark");
        document.documentElement.classList.add("mocha");
      } else {
        document.querySelector("#theme-color")?.setAttribute("content", "#04a5e5");
        document.documentElement.classList.add("light");
        document.documentElement.classList.add("latte");
      }
    </script>
    <style>
      html {
        background-color: #eff1f5;
      }
      html.dark {
        background-color: #1e1e2e;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>TrevStack</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app" class="bg-ctp-base"></div>
    <script src="/index.tsx" type="module"></script>
  </body>
</html>
