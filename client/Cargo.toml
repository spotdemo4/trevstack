[package]
name = "trevstack-client"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "full-stack template"
license = "MIT"
homepage = "https://trev.zip/llc/stack"
repository = "https://trev.zip/llc/stack"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
prost = "0.14"
prost-types = "0.14"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots", "transport"] }
tonic-prost = "0.14"
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
