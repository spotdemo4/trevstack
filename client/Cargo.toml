[package]
name = "trevstack-client"
version = "2.2.2"
edition = "2024"
rust-version = "1.99.0"
description = "full-stack template"
license = "MIT"
homepage = "https://trev.zip/template/stack"
repository = "https://trev.zip/template/stack"
publish = false

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
quinn = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
trevrpc = "1.4"
url = "2.5"

[dev-dependencies]
bytes = "1"
