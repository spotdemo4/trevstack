name: update

on:
  schedule:
    - cron: "0 9,21 * * *" # every day at 09:00 and 21:00 UTC
  workflow_dispatch:
    inputs:
      debug:
        description: Enable Renovate debug logging
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c184156b02706754274a295bca8418e75ccc0ef7 # v1.76.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          shell: update

      - name: Renovate
        run: renovate
        env:
          RENOVATE_CONFIG_FILE: .gitea/renovate.jsonc
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
