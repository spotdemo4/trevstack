name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@2ac230e81efe470dfc3202f1d24afb1661664c24 # v1.72.0
        with:
          shell: vulnerable

      - name: Run govulncheck
        working-directory: server
        run: govulncheck ./...

  rust:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@2ac230e81efe470dfc3202f1d24afb1661664c24 # v1.72.0
        with:
          shell: vulnerable

      - name: Run cargo audit
        working-directory: client
        run: cargo-audit audit

  npm:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@2ac230e81efe470dfc3202f1d24afb1661664c24 # v1.72.0
        with:
          shell: vulnerable

      - name: Run npm audit (web)
        working-directory: web
        run: npm audit --audit-level moderate

      - name: Run npm audit (docs)
        working-directory: docs
        run: npm audit --audit-level moderate

  nix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@2ac230e81efe470dfc3202f1d24afb1661664c24 # v1.72.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  actions:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@2ac230e81efe470dfc3202f1d24afb1661664c24 # v1.72.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor $(find .github/workflows -name "*.yaml")
