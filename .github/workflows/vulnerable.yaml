name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          shell: vulnerable

      - name: Run govulncheck
        working-directory: server
        run: govulncheck ./...

  rust:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          shell: vulnerable

      - name: Run cargo audit
        working-directory: client
        run: cargo-audit audit

  npm:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          shell: vulnerable

      - name: Run npm audit (web)
        working-directory: web
        run: npm audit --omit=dev --audit-level moderate

  android:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          shell: vulnerable

      - name: Run osv-scanner
        working-directory: android
        # only scans what the release APK ships, not build tools such as Android lint
        run: |
          lockfile=$(mktemp -d)/gradle.lockfile
          grep -E '[=,]releaseRuntimeClasspath(,|$)' app/gradle.lockfile > "$lockfile"
          osv-scanner scan source --lockfile "$lockfile"

  nix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  actions:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor $(find .github/workflows -name "*.yaml")
