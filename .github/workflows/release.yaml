name: release

on:
  push:
    tags: ["server/v*", "client/v*", "android/v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  server:
    if: startsWith(github.ref, 'refs/tags/server/v')
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.server.x86_64-unknown-linux-musl
            packages.x86_64-linux.server.aarch64-unknown-linux-musl
            packages.x86_64-linux.server.armv7l-unknown-linux-musleabihf
            packages.x86_64-linux.server.x86_64-w64-mingw32
            packages.x86_64-linux.server.arm64-apple-darwin
            images.x86_64-linux.server.x86_64-unknown-linux-gnu
            images.x86_64-linux.server.aarch64-unknown-linux-gnu
            images.x86_64-linux.server.armv7l-unknown-linux-gnueabihf

  client:
    if: startsWith(github.ref, 'refs/tags/client/v')
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.client.x86_64-unknown-linux-musl
            packages.x86_64-linux.client.aarch64-unknown-linux-musl
            packages.x86_64-linux.client.armv7l-unknown-linux-musleabihf
            packages.x86_64-linux.client.x86_64-w64-mingw32
            packages.x86_64-linux.client.arm64-apple-darwin
            images.x86_64-linux.client.x86_64-unknown-linux-gnu
            images.x86_64-linux.client.aarch64-unknown-linux-gnu
            images.x86_64-linux.client.armv7l-unknown-linux-gnueabihf

  android:
    if: startsWith(github.ref, 'refs/tags/android/v')
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@572569d9aa135d0d439a0b07cb819a0f4862c380 # v1.83.0
        with:
          fetch_depth: 0
          shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          # signs the APK; without them, it's released unsigned
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          PACKAGES: |
            packages.x86_64-linux.android
