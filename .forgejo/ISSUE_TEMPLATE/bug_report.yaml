name: Bug report
description: Report something that isn't working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you are using.
      placeholder: v1.2.3 or 0123abc
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and how you installed or ran the project.
      placeholder: |
        OS: NixOS 25.11
        Architecture: x86_64
        Installed with: nix run
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant output or error messages. This is rendered as code, so no backticks are needed.
      render: shell
    validations:
      required: false
