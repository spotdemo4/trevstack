openapi: 3.1.0
servers:
  - url: /grpc
info:
  title: TrevStack API
  version: 0.17.1
  description: API for TrevStack
  contact:
    name: Trev
    email: spam@trev.xyz
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: stack_session
  schemas:
    auth.v1.LoginRequest:
      type: object
      properties:
        username:
          type:
            - string
            - "null"
          examples:
            - demo_user
          title: username
          maxLength: 64
          minLength: 3
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        password:
          type:
            - string
            - "null"
          examples:
            - example-password
          title: password
          minLength: 8
          format: password
          description: |
            Account password; accepted as input and never returned in a response.
            string.max_bytes = 72
          writeOnly: true
      title: LoginRequest
      required:
        - username
        - password
      additionalProperties: false
      description: |-
        Credentials for an existing account.

         Example (protobuf JSON):
         ```json
         {"username": "demo_user", "password": "example-password"}
         ```
    auth.v1.LoginResponse:
      type: object
      properties:
        jwt:
          type: string
          examples:
            - example-session-token
          title: jwt
          description: Signed session token.
        sub:
          type: string
          examples:
            - demo_user
          title: sub
          description: The canonical username used as the session token's subject.
        exp:
          type:
            - integer
            - string
          examples:
            - "1893456000"
          title: exp
          format: int64
          description: The session token's expiration as Unix seconds, encoded as a decimal string in protobuf JSON.
      title: LoginResponse
      additionalProperties: false
      description: |-
        Session token and metadata returned after successful authentication.
         The example token is a placeholder, not a usable JWT.

         Example (protobuf JSON):
         ```json
         {"jwt": "example-session-token", "sub": "demo_user", "exp": "1893456000"}
         ```
    auth.v1.LogoutRequest:
      type: object
      title: LogoutRequest
      additionalProperties: false
    auth.v1.LogoutResponse:
      type: object
      title: LogoutResponse
      additionalProperties: false
    auth.v1.SignupRequest:
      type: object
      properties:
        username:
          type:
            - string
            - "null"
          examples:
            - demo_user
          title: username
          maxLength: 64
          minLength: 3
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        password:
          type:
            - string
            - "null"
          examples:
            - example-password
          title: password
          minLength: 8
          format: password
          description: |
            Account password; accepted as input and never returned in a response.
            string.max_bytes = 72
          writeOnly: true
      title: SignupRequest
      required:
        - username
        - password
      additionalProperties: false
      description: |-
        Credentials for a new account.

         Example (protobuf JSON):
         ```json
         {"username": "demo_user", "password": "example-password"}
         ```
    auth.v1.SignupResponse:
      type: object
      title: SignupResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: "#/components/schemas/connect.error_details.Any"
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: "Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation"
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: "A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field."
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    number.v1.AddRequest:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
          examples:
            - visits
          title: name
          maxLength: 50
          minLength: 1
        number:
          type:
            - integer
            - "null"
          title: number
          maximum: 1000000
          minimum: 1
      title: AddRequest
      required:
        - name
        - number
      additionalProperties: false
      description: |-
        A named positive value to record.

         Example (protobuf JSON):
         ```json
         {"name": "visits", "number": 7}
         ```
    number.v1.AddResponse:
      type: object
      properties:
        sum:
          type:
            - integer
            - string
          examples:
            - "42"
          title: sum
          format: int64
          description: Sum of all stored numbers after this addition, encoded as a decimal string in protobuf JSON.
      title: AddResponse
      additionalProperties: false
      description: |-
        Example (protobuf JSON):
         ```json
         {"sum": "42"}
         ```
    number.v1.DistributionBucket:
      type: object
      properties:
        lower:
          type: integer
          title: lower
        upper:
          type: integer
          title: upper
        count:
          type:
            - integer
            - string
          title: count
          format: int64
      title: DistributionBucket
      additionalProperties: false
    number.v1.DistributionRequest:
      type: object
      properties:
        bucketCount:
          type:
            - integer
            - "null"
          title: bucket_count
          maximum: 100
          minimum: 1
        start:
          title: start
          description: Inclusive lower timestamp bound; omit for no lower bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        end:
          title: end
          description: Inclusive upper timestamp bound; omit for no upper bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
      title: DistributionRequest
      required:
        - bucketCount
      additionalProperties: false
      description: |
        Histogram of `number` values across approximately equal-width buckets, suitable for bar charts.

         Example (protobuf JSON):
         ```json
         {"bucketCount": 10, "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
         ```
        end_after_start // End must be after start
    number.v1.DistributionResponse:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/number.v1.DistributionBucket"
          title: buckets
      title: DistributionResponse
      additionalProperties: false
    number.v1.Item:
      type: object
      properties:
        timestamp:
          title: timestamp
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        name:
          type: string
          title: name
          maxLength: 50
          minLength: 1
        number:
          type: integer
          title: number
          maximum: 1000000
          minimum: 0
      title: Item
      additionalProperties: false
    number.v1.ListRequest:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
          title: name
          maxLength: 50
          minLength: 0
        minimum:
          type:
            - integer
            - "null"
          title: minimum
          maximum: 1000000
          minimum: 0
        maximum:
          type:
            - integer
            - "null"
          title: maximum
          maximum: 1000000
          minimum: 0
        start:
          title: start
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        end:
          title: end
          $ref: "#/components/schemas/google.protobuf.Timestamp"
      title: ListRequest
      additionalProperties: false
      description: |
        Optional filters for the item stream. Timestamps use RFC 3339 strings in protobuf JSON.

         Example (protobuf JSON):
         ```json
         {"name": "visits", "minimum": 1, "maximum": 100, "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
         ```
        end_after_start // End must be after start
        minimum_less_than_maximum // Minimum must be less than maximum
    number.v1.ListResponse:
      type: object
      properties:
        item:
          title: item
          $ref: "#/components/schemas/number.v1.Item"
      title: ListResponse
      additionalProperties: false
      description: |-
        One matching item in the server stream, not an array of results.

         Example (protobuf JSON):
         ```json
         {"item": {"timestamp": "2026-09-20T12:00:00Z", "name": "visits", "number": 7}}
         ```
    number.v1.SummaryRequest:
      type: object
      properties:
        start:
          title: start
          description: Inclusive lower timestamp bound; omit for no lower bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        end:
          title: end
          description: Inclusive upper timestamp bound; omit for no upper bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
      title: SummaryRequest
      additionalProperties: false
      description: |
        Scalar summary metrics across all items, suitable for stat cards.

         Example (protobuf JSON):
         ```json
         {"start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
         ```
        end_after_start // End must be after start
    number.v1.SummaryResponse:
      type: object
      properties:
        totalCount:
          type:
            - integer
            - string
          title: total_count
          format: int64
        totalSum:
          type:
            - integer
            - string
          title: total_sum
          format: int64
        average:
          type: number
          title: average
          format: double
        min:
          type: integer
          title: min
        max:
          type: integer
          title: max
        distinctNames:
          type: integer
          title: distinct_names
      title: SummaryResponse
      additionalProperties: false
      description: |-
        Counts and sums use decimal strings for 64-bit integers in protobuf JSON.

         Example (protobuf JSON):
         ```json
         {"totalCount": "3", "totalSum": "42", "average": 14, "min": 7, "max": 21, "distinctNames": 2}
         ```
    number.v1.TimeInterval:
      type: string
      title: TimeInterval
      enum:
        - TIME_INTERVAL_UNSPECIFIED
        - TIME_INTERVAL_HOUR
        - TIME_INTERVAL_DAY
        - TIME_INTERVAL_WEEK
        - TIME_INTERVAL_MONTH
      description: Time-bucketed counts and sums, suitable for line/area charts.
    number.v1.TimeSeriesPoint:
      type: object
      properties:
        bucket:
          title: bucket
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        count:
          type:
            - integer
            - string
          title: count
          format: int64
        sum:
          type:
            - integer
            - string
          title: sum
          format: int64
        average:
          type: number
          title: average
          format: double
      title: TimeSeriesPoint
      additionalProperties: false
    number.v1.TimeSeriesRequest:
      type: object
      properties:
        interval:
          oneOf:
            - $ref: "#/components/schemas/number.v1.TimeInterval"
            - type: "null"
          not:
            enum:
              - TIME_INTERVAL_UNSPECIFIED
          title: interval
        start:
          title: start
          description: Inclusive lower timestamp bound; omit for no lower bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        end:
          title: end
          description: Inclusive upper timestamp bound; omit for no upper bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
      title: TimeSeriesRequest
      required:
        - interval
      additionalProperties: false
      description: |
        Selects the UTC bucket interval and optional time range.

         Example (protobuf JSON):
         ```json
         {"interval": "TIME_INTERVAL_DAY", "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
         ```
        end_after_start // End must be after start
    number.v1.TimeSeriesResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/number.v1.TimeSeriesPoint"
          title: points
      title: TimeSeriesResponse
      additionalProperties: false
    number.v1.TopName:
      type: object
      properties:
        name:
          type: string
          title: name
        count:
          type:
            - integer
            - string
          title: count
          format: int64
        sum:
          type:
            - integer
            - string
          title: sum
          format: int64
        average:
          type: number
          title: average
          format: double
      title: TopName
      additionalProperties: false
    number.v1.TopNamesRequest:
      type: object
      properties:
        limit:
          type:
            - integer
            - "null"
          title: limit
          maximum: 100
          minimum: 1
        start:
          title: start
          description: Inclusive lower timestamp bound; omit for no lower bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
        end:
          title: end
          description: Inclusive upper timestamp bound; omit for no upper bound.
          $ref: "#/components/schemas/google.protobuf.Timestamp"
      title: TopNamesRequest
      required:
        - limit
      additionalProperties: false
      description: |
        Top N names by frequency and total value, suitable for bar/pie charts.

         Example (protobuf JSON):
         ```json
         {"limit": 5, "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
         ```
        end_after_start // End must be after start
    number.v1.TopNamesResponse:
      type: object
      properties:
        names:
          type: array
          items:
            $ref: "#/components/schemas/number.v1.TopName"
          title: names
      title: TopNamesResponse
      additionalProperties: false
security:
  - sessionCookie: []
paths:
  /auth.v1.AuthService/Login:
    post:
      tags:
        - auth.v1.AuthService
      summary: Start a session
      description: |-
        Authenticates an account, sets the HttpOnly stack_session cookie, and returns session metadata.
         Unknown usernames and incorrect passwords both return an unauthenticated error.
      operationId: auth.v1.AuthService.Login
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.v1.LoginRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.v1.LoginResponse"
      security:
        - {}
  /auth.v1.AuthService/Logout:
    post:
      tags:
        - auth.v1.AuthService
      summary: Clear the session cookie
      description: Clears the stack_session cookie without requiring an active session. Does not revoke issued JWTs.
      operationId: auth.v1.AuthService.Logout
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.v1.LogoutRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.v1.LogoutResponse"
      security:
        - {}
  /auth.v1.AuthService/Signup:
    post:
      tags:
        - auth.v1.AuthService
      summary: Create an account
      description: Creates an account with a case-insensitive username. Does not sign in or set a session cookie.
      operationId: auth.v1.AuthService.Signup
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.v1.SignupRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.v1.SignupResponse"
      security:
        - {}
  /number.v1.NumberService/Add:
    post:
      tags:
        - number.v1.NumberService
      summary: Record a number
      description: Records a named value and returns the sum of all stored numbers, not just this name or user.
      operationId: number.v1.NumberService.Add
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/number.v1.AddRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/number.v1.AddResponse"
  /number.v1.NumberService/Distribution:
    post:
      tags:
        - number.v1.NumberService
      summary: Get the value distribution
      description: |-
        Groups values into approximately equal-width buckets over the observed range, including empty buckets.
         No matching items produce no buckets; identical values produce a single bucket.
      operationId: number.v1.NumberService.Distribution
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/number.v1.DistributionRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/number.v1.DistributionResponse"
  /number.v1.NumberService/List: {}
  /number.v1.NumberService/Summary:
    post:
      tags:
        - number.v1.NumberService
      summary: Summarize recorded numbers
      description: |-
        Returns count, sum, average, minimum, maximum, and distinct-name count for the selected time range.
         All aggregates are zero when no items match.
      operationId: number.v1.NumberService.Summary
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/number.v1.SummaryRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/number.v1.SummaryResponse"
  /number.v1.NumberService/TimeSeries:
    post:
      tags:
        - number.v1.NumberService
      summary: Get metrics over time
      description: |-
        Returns counts, sums, and averages in ascending UTC time buckets. Empty buckets are omitted.
         Weeks begin on Sunday; months begin on the first day.
      operationId: number.v1.NumberService.TimeSeries
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/connect-protocol-version"
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: "#/components/schemas/connect-timeout-header"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/number.v1.TimeSeriesRequest"
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connect.error"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/number.v1.TimeSeriesResponse"
  /number.v1.NumberService/TopNames:
    post:
      tags:
        - number.v1.NumberService
      summary: Get the most frequent names
