openapi: 3.1.0
servers:
  - url: /grpc

info:
  title: TrevStack API
  version: 0.17.1
  description: API for TrevStack
  contact:
    name: Trev
    email: spam@trev.xyz

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: stack_session

security:
  - sessionCookie: []

paths:
  /auth.v1.AuthService/Login:
    post:
      security: []
      operationId: auth.v1.AuthService.Login
      responses:
        default:
          description: Error
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                  sub:
                    type: string
                    description: The canonical username used as the session token's subject.
                  exp:
                    type:
                      - integer
                      - string
                    format: int64
                    description: The session token's expiration as Unix seconds, encoded as a decimal string in protobuf JSON.
                required:
                  - jwt
                  - sub
                  - exp
  /auth.v1.AuthService/Logout:
    post:
      security: []
      operationId: auth.v1.AuthService.Logout
      responses:
        default:
          description: Error
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
  /auth.v1.AuthService/Signup:
    post:
      security: []
      operationId: auth.v1.AuthService.Signup
      responses:
        default:
          description: Error
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
