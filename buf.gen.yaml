version: v2

plugins:
  - local: protoc-gen-go
    out: server/connect
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE

  - local: protoc-gen-connect-go
    out: server/connect
    opt:
      - paths=source_relative
      - simple

  - local: protoc-gen-connect-openapi
    out: docs
    strategy: all
    opt:
      - base=docs/openapi.base.yaml
      - path=openapi.yaml
      - features=connectrpc;protovalidate

  - local: protoc-gen-es
    out: web/connect
    opt: target=ts
    include_imports: true

  - local: protoc-gen-prost
    out: client/src/connect
    strategy: all
    opt:
      - flat_output_dir

  - local: protoc-gen-tonic
    out: client/src/connect
    strategy: all
    opt:
      - flat_output_dir
      - no_server

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: trev.zip/llc/stack/server/connect
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
