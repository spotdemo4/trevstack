# yaml-language-server: $schema=https://www.schemastore.org/buf.gen.json
# https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2

plugins:
  - local: protoc-gen-go
    out: server/gen
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE

  - local: protoc-gen-trevrpc-go
    out: server/gen
    opt:
      - paths=source_relative

  - local: protoc-gen-trevrpc-js
    out: web/gen

  - local: protoc-gen-prost
    out: client/src/gen
    strategy: all
    opt:
      - flat_output_dir

  - local: protoc-gen-trevrpc-rust
    out: client/src/gen
    strategy: all

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: trev.zip/template/stack/server/v2/gen
  disable:
    - file_option: go_package_prefix
      module: buf.build/trevrpc/trevrpc
