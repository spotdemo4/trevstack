syntax = "proto3";

package cursor.v1;

import "google/protobuf/timestamp.proto";

// The RPC that recorded a stream of positions.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  // A single position from Send.
  SOURCE_SEND = 1;
  // A client stream from Track.
  SOURCE_TRACK = 2;
  // A bidirectional stream from Share.
  SOURCE_SHARE = 3;
}

// A recorded position. x and y are fractions of the pad's width and height, measured from its
// top-left corner, so every client's pad can show the same position whatever its size.
message Cursor {
  // The stream the position belongs to. Each Send call is a stream of its own.
  int64 stream_id = 1;
  string username = 2;
  Source source = 3;
  double x = 4;
  double y = 5;
  google.protobuf.Timestamp timestamp = 6;
}

// A Track or Share stream that ended, whose cursor will not move again.
message StreamEnd {
  int64 stream_id = 1;
  string username = 2;
}

// The positions of one stream, in aggregate.
message StreamSummary {
  int64 id = 1;
  string username = 2;
  Source source = 3;
  // Time of the first position.
  google.protobuf.Timestamp start = 4;
  // Time of the last position.
  google.protobuf.Timestamp end = 5;
  // Number of positions.
  int64 count = 6;
  // Total distance between consecutive positions, in fractions of the pad's size.
  double distance = 7;
}
