syntax = "proto3";

package cursor.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Scalar summary metrics across all positions, suitable for stat cards.
message SummaryRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 1 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message SummaryResponse {
  // Number of positions.
  int64 count = 1;
  // Number of streams with a position in range.
  int64 streams = 2;
  // Number of users with a position in range.
  int64 users = 3;
  // Total distance between consecutive positions, in fractions of the pad's size.
  double distance = 4;
  // Positions per stream.
  double average_count = 5;
  // Distance per stream.
  double average_distance = 6;
}

// Time-bucketed counts, suitable for line/area charts.
enum TimeInterval {
  TIME_INTERVAL_UNSPECIFIED = 0;
  TIME_INTERVAL_MINUTE = 1;
  TIME_INTERVAL_HOUR = 2;
  TIME_INTERVAL_DAY = 3;
  TIME_INTERVAL_WEEK = 4;
  TIME_INTERVAL_MONTH = 5;
}

// Selects the UTC bucket interval and optional time range.
message TimeSeriesRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Required. Any interval except TIME_INTERVAL_UNSPECIFIED.
  optional TimeInterval interval = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message TimeSeriesPoint {
  google.protobuf.Timestamp bucket = 1;
  // Number of positions.
  int64 count = 2;
  // Number of streams with a position in the bucket.
  int64 streams = 3;
  // Number of users with a position in the bucket.
  int64 users = 4;
}

message TimeSeriesResponse {
  repeated TimeSeriesPoint points = 1;
}

// Counts of positions in a grid of equal cells over the pad, suitable for heatmaps.
message HeatmapRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Required. 1 to 100.
  optional uint32 columns = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  // Required. 1 to 100.
  optional uint32 rows = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 4 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message HeatmapResponse {
  uint32 columns = 1;
  uint32 rows = 2;
  // Positions in each cell, row by row from the top-left: the cell in column c of row r is at
  // index r * columns + c.
  repeated int64 counts = 3;
}

// Top N users by positions, suitable for bar/pie charts.
message TopUsersRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Required. 1 to 100.
  optional uint32 limit = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message TopUser {
  string username = 1;
  // Number of positions.
  int64 count = 2;
  // Number of streams with a position in range.
  int64 streams = 3;
  // Total distance between consecutive positions, in fractions of the pad's size.
  double distance = 4;
}

message TopUsersResponse {
  repeated TopUser users = 1;
}
