syntax = "proto3";

package number.v1;

// A named positive value to record.
message AddRequest {
  // Required. 1 to 50 characters.
  optional string name = 1;
  // Required. 1 to 1000000.
  optional uint32 number = 2;
}

message AddResponse {
  // Sum of all stored numbers after this addition.
  uint64 sum = 1;
}
