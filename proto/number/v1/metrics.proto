syntax = "proto3";

package number.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Scalar summary metrics across all items, suitable for stat cards.
message SummaryRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 1 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message SummaryResponse {
  int64 total_count = 1;
  uint64 total_sum = 2;
  double average = 3;
  uint32 min = 4;
  uint32 max = 5;
  uint32 distinct_names = 6;
}

// Time-bucketed counts and sums, suitable for line/area charts.
enum TimeInterval {
  TIME_INTERVAL_UNSPECIFIED = 0;
  TIME_INTERVAL_HOUR = 1;
  TIME_INTERVAL_DAY = 2;
  TIME_INTERVAL_WEEK = 3;
  TIME_INTERVAL_MONTH = 4;
}

// Selects the UTC bucket interval and optional time range.
message TimeSeriesRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Required. Any interval except TIME_INTERVAL_UNSPECIFIED.
  optional TimeInterval interval = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message TimeSeriesPoint {
  google.protobuf.Timestamp bucket = 1;
  int64 count = 2;
  uint64 sum = 3;
  double average = 4;
}

message TimeSeriesResponse {
  repeated TimeSeriesPoint points = 1;
}

// Histogram of `number` values across approximately equal-width buckets, suitable for bar charts.
message DistributionRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Required. 1 to 100.
  optional uint32 bucket_count = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message DistributionBucket {
  uint32 lower = 1;
  uint32 upper = 2;
  int64 count = 3;
}

message DistributionResponse {
  repeated DistributionBucket buckets = 1;
}

// Top N names by frequency and total value, suitable for bar/pie charts.
message TopNamesRequest {
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // Required. 1 to 100.
  optional uint32 limit = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // Inclusive upper timestamp bound, after start; omit for no upper bound.
  google.protobuf.Timestamp end = 3 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

message TopName {
  string name = 1;
  int64 count = 2;
  uint64 sum = 3;
  double average = 4;
}

message TopNamesResponse {
  repeated TopName names = 1;
}
