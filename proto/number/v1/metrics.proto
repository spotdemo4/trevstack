syntax = "proto3";

package number.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Scalar summary metrics across all items, suitable for stat cards.
//
// Example (protobuf JSON):
// ```json
// {"start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
// ```
message SummaryRequest {
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 1;
  // Inclusive upper timestamp bound; omit for no upper bound.
  google.protobuf.Timestamp end = 2;

  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "End must be after start"
    expression: "!has(this.end) || !has(this.start) || this.end > this.start"
  };
}

// Counts and sums use decimal strings for 64-bit integers in protobuf JSON.
//
// Example (protobuf JSON):
// ```json
// {"totalCount": "3", "totalSum": "42", "average": 14, "min": 7, "max": 21, "distinctNames": 2}
// ```
message SummaryResponse {
  int64 total_count = 1;
  uint64 total_sum = 2;
  double average = 3;
  uint32 min = 4;
  uint32 max = 5;
  uint32 distinct_names = 6;
}

// Time-bucketed counts and sums, suitable for line/area charts.
enum TimeInterval {
  TIME_INTERVAL_UNSPECIFIED = 0;
  TIME_INTERVAL_HOUR = 1;
  TIME_INTERVAL_DAY = 2;
  TIME_INTERVAL_WEEK = 3;
  TIME_INTERVAL_MONTH = 4;
}

// Selects the UTC bucket interval and optional time range.
//
// Example (protobuf JSON):
// ```json
// {"interval": "TIME_INTERVAL_DAY", "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
// ```
message TimeSeriesRequest {
  optional TimeInterval interval = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2;
  // Inclusive upper timestamp bound; omit for no upper bound.
  google.protobuf.Timestamp end = 3;

  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "End must be after start"
    expression: "!has(this.end) || !has(this.start) || this.end > this.start"
  };
}

message TimeSeriesPoint {
  google.protobuf.Timestamp bucket = 1;
  int64 count = 2;
  uint64 sum = 3;
  double average = 4;
}

message TimeSeriesResponse {
  repeated TimeSeriesPoint points = 1;
}

// Histogram of `number` values across approximately equal-width buckets, suitable for bar charts.
//
// Example (protobuf JSON):
// ```json
// {"bucketCount": 10, "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
// ```
message DistributionRequest {
  optional uint32 bucket_count = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 100
    }
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2;
  // Inclusive upper timestamp bound; omit for no upper bound.
  google.protobuf.Timestamp end = 3;

  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "End must be after start"
    expression: "!has(this.end) || !has(this.start) || this.end > this.start"
  };
}

message DistributionBucket {
  uint32 lower = 1;
  uint32 upper = 2;
  int64 count = 3;
}

message DistributionResponse {
  repeated DistributionBucket buckets = 1;
}

// Top N names by frequency and total value, suitable for bar/pie charts.
//
// Example (protobuf JSON):
// ```json
// {"limit": 5, "start": "2026-09-01T00:00:00Z", "end": "2026-10-01T00:00:00Z"}
// ```
message TopNamesRequest {
  optional uint32 limit = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 100
    }
  ];
  // Inclusive lower timestamp bound; omit for no lower bound.
  google.protobuf.Timestamp start = 2;
  // Inclusive upper timestamp bound; omit for no upper bound.
  google.protobuf.Timestamp end = 3;

  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "End must be after start"
    expression: "!has(this.end) || !has(this.start) || this.end > this.start"
  };
}

message TopName {
  string name = 1;
  int64 count = 2;
  uint64 sum = 3;
  double average = 4;
}

message TopNamesResponse {
  repeated TopName names = 1;
}
