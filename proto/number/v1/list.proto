syntax = "proto3";

package number.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message Item {
  google.protobuf.Timestamp timestamp = 1;
  string name = 2;
  uint32 number = 3;
}

// Optional filters for the item stream.
message ListRequest {
  option (buf.validate.message).cel = {
    id: "minimum_less_than_maximum"
    message: "minimum must be less than maximum"
    expression: "!has(this.minimum) || !has(this.maximum) || this.minimum < this.maximum"
  };
  option (buf.validate.message).cel = {
    id: "end_after_start"
    message: "end must be after start"
    expression: "!has(this.start) || !has(this.end) || this.end > this.start"
  };

  // At most 50 characters.
  optional string name = 1 [(buf.validate.field).string.max_len = 50];
  // 0 to 1000000, and less than maximum.
  optional uint32 minimum = 2 [(buf.validate.field).uint32.lte = 1000000];
  // 0 to 1000000, and greater than minimum.
  optional uint32 maximum = 3 [(buf.validate.field).uint32.lte = 1000000];
  google.protobuf.Timestamp start = 4 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
  // After start.
  google.protobuf.Timestamp end = 5 [(buf.validate.field).timestamp = {
    gte: {seconds: -62135596800}
    lte: {
      seconds: 253402300799
      nanos: 999999999
    }
  }];
}

// One matching item in the server stream, not an array of results.
message ListResponse {
  Item item = 1;
}
