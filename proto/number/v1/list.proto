syntax = "proto3";

package number.v1;

import "google/protobuf/timestamp.proto";

message Item {
  google.protobuf.Timestamp timestamp = 1;
  string name = 2;
  uint32 number = 3;
}

// Optional filters for the item stream.
message ListRequest {
  // At most 50 characters.
  optional string name = 1;
  // 0 to 1000000, and less than maximum.
  optional uint32 minimum = 2;
  // 0 to 1000000, and greater than minimum.
  optional uint32 maximum = 3;
  google.protobuf.Timestamp start = 4;
  // After start.
  google.protobuf.Timestamp end = 5;
}

// One matching item in the server stream, not an array of results.
message ListResponse {
  Item item = 1;
}
