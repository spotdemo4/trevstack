syntax = "proto3";

package auth.v1;

// Credentials for a new account.
message SignupRequest {
  // Required. 3 to 64 letters, digits, underscores, or hyphens, starting with a letter or digit.
  optional string username = 1;
  // Required. At least 8 characters and at most 72 bytes; never returned in a response.
  optional string password = 2;
}

message SignupResponse {}
